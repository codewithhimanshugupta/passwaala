<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />

    <title>PassWaala Rider</title>
    <meta name="description" content="Accept deliveries and track earnings on PassWaala" />
    <meta name="theme-color" content="#0B7A4B" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PassWaala Rider" />
    <meta name="application-name" content="PassWaala Rider" />
    <meta name="msapplication-TileColor" content="#0B7A4B" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />

    <style>
      html, body { margin: 0; padding: 0; background-color: #F5F6F8; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
            .catch(function (err) { console.warn('[Rider SW] registration failed:', err); });
        });
      }
    </script>
  </body>
</html>
