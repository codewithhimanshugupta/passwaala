<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />

    <title>PassWaala Admin</title>
    <meta name="description" content="PassWaala operations & partner console" />
    <meta name="theme-color" content="#1E293B" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PassWaala Admin" />
    <meta name="application-name" content="PassWaala Admin" />
    <meta name="msapplication-TileColor" content="#1E293B" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <style>
      html, body { margin: 0; padding: 0; background-color: #F8FAFC; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
            .catch(function (err) { console.warn('[Admin SW] registration failed:', err); });
        });
      }
    </script>
  </body>
</html>
