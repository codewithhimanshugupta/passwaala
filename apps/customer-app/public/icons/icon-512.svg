<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Full bleed green background — maskable icons fill the whole square -->
  <rect width="512" height="512" fill="#0B7A4B"/>
  <!-- Subtle radial highlight so the icon doesn't look flat at large size -->
  <radialGradient id="hl" cx="38%" cy="32%" r="55%">
    <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
    <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
  </radialGradient>
  <rect width="512" height="512" fill="url(#hl)"/>
  <!-- "P" centred in the safe zone (inner 80% = 102px padding each side) -->
  <text
    x="256" y="356"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="310"
    font-weight="900"
    fill="#FFFFFF"
    letter-spacing="-10"
  >P</text>
  <!-- Saffron accent dot -->
  <circle cx="316" cy="152" r="28" fill="#F59E0B"/>
</svg>
