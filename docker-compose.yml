# NearBaz — Docker Compose (local dev)
# Postgres + PostGIS with a persistent named volume.
# All dev data stays on your machine — ₹0, offline, production-identical.
# The same image powers CI tests.

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: nearbaz-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nearbaz
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: nearbaz
    ports:
      - "5432:5432"
    volumes:
      - nearbaz_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nearbaz -d nearbaz"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis — used later for the BullMQ job queue, cache, and WebSocket fan-out.
  # Present from day one so the async-work seams are real, not retrofitted.
  redis:
    image: redis:7-alpine
    container_name: nearbaz-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - nearbaz_redisdata:/data

volumes:
  nearbaz_pgdata:
  nearbaz_redisdata:
